name: Get Runner IP
description: Fetch the runner public IP from a list of sources and return it as an output.
inputs:
  sources:
    description: Newline-separated, ordered list of URLs to fetch the runner public IP from. The first one that answers wins.
    required: false
    default: |
      https://checkip.amazonaws.com
      https://whatismyip.akamai.com
      https://icanhazip.com
outputs:
  ip:
    description: The parsed and validated runner public IP address.
    value: ${{ steps.get-ip.outputs.ip }}
  mask:
    description: The parsed and validated runner public IP mask.
    value: ${{ steps.get-ip.outputs.mask }}
  cidr:
    description: The parsed and validated runner public IP in CIDR notation.
    value: ${{ steps.get-ip.outputs.cidr }}
runs:
  using: composite
  steps:
    - name: Get runner public IP
      id: get-ip
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SOURCES: ${{ inputs.sources }}
      with:
        script: |
          const net = require('node:net');
          const timeoutMs = 15000;

          const isLikelyIp = (value) => {
            if (typeof value !== 'string') return false;
            const v = value.trim();
            if (!v) return false;
            return net.isIP(v) !== 0;
          };

          // Query one source and report back rather than failing the step, so the caller can move on.
          const fetchIp = async (source) => {
            const controller = new AbortController();
            const timeout = setTimeout(() => {
              controller.abort(new Error(`Request timed out after ${timeoutMs}ms`));
            }, timeoutMs);
            let response;
            try {
              response = await fetch(source, {
                signal: controller.signal,
                headers: {
                  'User-Agent': 'actions/github-script get-runner-ip',
                  'Accept': 'text/plain,application/json,*/*',
                },
              });
            } catch (e) {
              return { error: `failed to fetch: ${e?.message || e}` };
            } finally {
              clearTimeout(timeout);
            }
            if (!response.ok) {
              const body = await response.text().catch(() => '');
              return { error: `HTTP ${response.status} ${response.statusText}${body ? `; body: ${body.slice(0, 200)}` : ''}` };
            }
            const rawText = await response.text();
            const trimmed = (rawText || '').trim();
            if (isLikelyIp(trimmed)) {
              return { ip: trimmed };
            }
            let data;
            try {
              data = JSON.parse(trimmed);
            } catch (e) {
              return { error: `body is neither an IP address nor JSON: ${e?.message || e}; body starts with: ${trimmed.slice(0, 200)}` };
            }
            // Common response shapes from IP endpoints
            const candidate = [
              data?.ip,
              data?.origin,
              data?.query,
              data?.address,
              data?.data?.ip,
              data?.data?.address,
            ].find((c) => isLikelyIp(c));
            if (!candidate) {
              return { error: `no IP address found in JSON body starting with: ${trimmed.slice(0, 200)}` };
            }
            return { ip: candidate.trim() };
          };

          const sources = (process.env.SOURCES || '')
            .split('\n')
            .map((s) => s.trim())
            .filter((s) => s.length > 0);
          if (sources.length === 0) {
            core.setFailed("Input 'sources' must list at least one URL");
            return;
          }

          const errors = [];
          const answers = new Map();
          for (const source of sources) {
            const result = await fetchIp(source);
            if (result.error) {
              core.info(`${source}: ${result.error}`);
              errors.push(`${source}: ${result.error}`);
              continue;
            }
            core.info(`${source}: ${result.ip}`);
            answers.set(source, result.ip);
          }
          if (answers.size === 0) {
            core.setFailed(`No source could tell us the runner public IP:\n${errors.join('\n')}`);
            return;
          }

          const [winner, ip] = [...answers][0];
          core.info(`Using runner public IP ${ip} as reported by ${winner}`);
          // A runner behind a SNAT pool may legitimately egress from more than one address.
          for (const [source, other] of answers) {
            if (other !== ip) {
              core.warning(`${source} reports ${other} while ${winner} reports ${ip}`);
            }
          }

          core.setOutput('ip', ip);
          const mask = net.isIPv6(ip) ? "128" : "32";
          core.setOutput('mask', mask);
          core.setOutput('cidr', `${ip}/${mask}`);
